  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

2D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Montserrat';\n  font-style: normal;\n  font-weight: 900;\n  font-display: swap;\n  src: url(\"68050e16-8038-46d2-a04d-c764d38efc7f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n  <style>/* ============================================================\n   UVG Global — Sitio Relaciones Internacionales\n   ============================================================ */\n\n:root {\n  /* Brand — UVG institutional green */\n  --uvg-green: #00693E;\n  --uvg-green-deep: #00562F;\n  --uvg-green-soft: #1C8A57;\n  --uvg-green-pale: #E6F2EB;\n  --uvg-gold: #8BC53F;          /* UVG bright leaf-green accent */\n  --uvg-gold-pale: #EAF5D8;\n\n  /* Neutrals */\n  --ink: #0F1411;\n  --ink-soft: #2A3530;\n  --muted: #6A7670;\n  --line: #D8DAD3;\n  --paper: #FFFFFF;       /* clean white */\n  --paper-2: #F3F5F3;     /* cool light gray-green */\n  --white: #FFFFFF;\n\n  /* Type */\n  --font-display: \"Montserrat\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-sans: \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n\n  /* Layout */\n  --maxw: 1280px;\n  --gutter: 32px;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--paper);\n  color: var(--ink);\n  font-family: var(--font-sans);\n  font-size: 17px;\n  line-height: 1.55;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\nimg { max-width: 100%; display: block; }\n\na { color: inherit; text-decoration: none; }\n\n::selection { background: var(--uvg-green); color: #fff; }\n\n/* ----- Typography ----- */\n.display {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-style: normal;\n  letter-spacing: -0.01em;\n  line-height: 1;\n}\n\nh1, h2, h3, h4 { margin: 0; font-weight: 600; }\n\n.eyebrow {\n  font-family: var(--font-sans);\n  font-weight: 600;\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--uvg-green);\n}\n\n.eyebrow .dot {\n  display: inline-block;\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--uvg-green);\n  margin-right: 10px;\n  vertical-align: middle;\n  transform: translateY(-2px);\n}\n\n.section-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(36px, 5vw, 64px);\n  line-height: 1.02;\n  letter-spacing: -0.015em;\n  color: var(--ink);\n  text-wrap: balance;\n}\n\n.section-kicker {\n  font-family: var(--font-sans);\n  font-weight: 400;\n  font-size: 18px;\n  line-height: 1.55;\n  color: var(--ink-soft);\n  max-width: 60ch;\n  text-wrap: pretty;\n}\n\n/* ----- Layout ----- */\n.wrap {\n  max-width: var(--maxw);\n  margin: 0 auto;\n  padding: 0 var(--gutter);\n}\n\n.section {\n  padding: 96px 0;\n  position: relative;\n}\n\n.section--tight { padding: 64px 0; }\n\n.section--green {\n  background: var(--uvg-green);\n  color: #fff;\n}\n.section--green .section-title { color: #fff; }\n.section--green .eyebrow { color: var(--uvg-gold); }\n.section--green .eyebrow .dot { background: var(--uvg-gold); }\n.section--green .section-kicker { color: rgba(255,255,255,0.82); }\n\n.section--cream { background: var(--paper-2); }\n\n.section-head {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 18px;\n  margin-bottom: 56px;\n  max-width: 900px;\n}\n\n@media (min-width: 900px) {\n  .section-head--split {\n    grid-template-columns: 1.2fr 1fr;\n    align-items: end;\n    gap: 64px;\n    max-width: none;\n  }\n}\n\n/* ----- Header / Nav ----- */\n.site-header {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  background: rgba(255,255,255,0.92);\n  backdrop-filter: saturate(140%) blur(10px);\n  -webkit-backdrop-filter: saturate(140%) blur(10px);\n  border-bottom: 1px solid var(--line);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  height: 92px;\n  gap: 24px;\n}\n\n.nav-logo {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n}\n.nav-logo img {\n  height: 56px;\n  width: auto;\n}\n.nav-logo .sep {\n  width: 1px;\n  height: 26px;\n  background: var(--line);\n}\n.nav-logo .uvg-tagline {\n  font-family: var(--font-sans);\n  font-size: 11px;\n  letter-spacing: 0.16em;\n  color: var(--muted);\n  text-transform: uppercase;\n  line-height: 1.3;\n  max-width: 160px;\n}\n\n.nav-menu {\n  display: none;\n  gap: 28px;\n  font-size: 14px;\n  font-weight: 500;\n}\n@media (min-width: 980px) {\n  .nav-menu { display: flex; }\n}\n\n.nav-menu a {\n  position: relative;\n  padding: 6px 0;\n  color: var(--ink);\n}\n.nav-menu a::after {\n  content: \"\";\n  position: absolute;\n  left: 0; right: 100%;\n  bottom: 0;\n  height: 2px;\n  background: var(--uvg-green);\n  transition: right .25s ease;\n}\n.nav-menu a:hover::after { right: 0; }\n\n.nav-cta {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  background: var(--uvg-green);\n  color: #fff;\n  padding: 11px 18px;\n  border-radius: 999px;\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.02em;\n  transition: background .2s ease, transform .2s ease;\n}\n.nav-cta:hover { background: var(--uvg-green-deep); transform: translateY(-1px); }\n.nav-cta svg { width: 14px; height: 14px; }\n\n/* ----- Buttons ----- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  padding: 14px 22px;\n  border-radius: 999px;\n  font-size: 14px;\n  font-weight: 600;\n  letter-spacing: 0.02em;\n  border: 1.5px solid transparent;\n  cursor: pointer;\n  transition: all .22s ease;\n  font-family: var(--font-sans);\n  background: transparent;\n  color: inherit;\n}\n.btn--primary {\n  background: var(--uvg-green);\n  color: #fff;\n}\n.btn--primary:hover { background: var(--uvg-green-deep); }\n.btn--ghost {\n  border-color: currentColor;\n  color: inherit;\n}\n.btn--ghost:hover { background: rgba(0,0,0,.04); }\n.btn--ghost-light {\n  border-color: rgba(255,255,255,.4);\n  color: #fff;\n}\n.btn--ghost-light:hover { background: rgba(255,255,255,.08); }\n.btn svg { width: 16px; height: 16px; }\n\n/* ============================================================\n   HERO  —  Texas Global-style carousel\n   ============================================================ */\n.hero {\n  position: relative;\n  background:\n    radial-gradient(ellipse at 50% 0%, rgba(14,92,61,0.06) 0%, transparent 60%),\n    var(--paper);\n  color: var(--ink);\n  overflow: hidden;\n  padding: 120px 0 88px;\n  isolation: isolate;\n}\n\n.hero-headline {\n  text-align: center;\n  max-width: 1100px;\n  margin: 0 auto 64px;\n  padding: 0 var(--gutter);\n  position: relative;\n  z-index: 3;\n}\n.hero-banner {\n  display: block;\n  width: 100%;\n  max-width: 980px;\n  height: auto;\n  margin: 0 auto;\n}\n\n.hero-eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: 12px;\n  font-size: 12px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--uvg-green);\n  margin-bottom: 24px;\n}\n.hero-eyebrow .line {\n  width: 36px; height: 1px;\n  background: var(--uvg-green);\n}\n\n.hero-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(64px, 10vw, 152px);\n  line-height: 0.95;\n  letter-spacing: -0.025em;\n  color: var(--uvg-green);\n  margin: 0 0 18px;\n  text-wrap: balance;\n}\n.hero-title em {\n  font-style: italic;\n  color: var(--uvg-gold);\n}\n\n.hero-tagline {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-weight: 400;\n  font-size: clamp(22px, 2.6vw, 34px);\n  line-height: 1.2;\n  color: var(--ink-soft);\n  letter-spacing: -0.005em;\n  text-wrap: balance;\n  max-width: 28ch;\n  margin: 0 auto;\n}\n\n/* ---- Carousel ---- */\n.hero-carousel {\n  position: relative;\n  z-index: 2;\n  height: 620px;\n  max-width: 1700px;\n  margin: 0 auto;\n  perspective: 2200px;\n}\n\n.carousel-track {\n  position: relative;\n  height: 100%;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transform-style: preserve-3d;\n}\n\n.hero-card {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  width: 440px;\n  height: 580px;\n  margin-left: -220px;\n  margin-top: -290px;\n  border-radius: 8px;\n  overflow: hidden;\n  box-shadow: 0 30px 60px -28px rgba(8,40,28,0.45);\n  cursor: pointer;\n  transition:\n    transform 0.7s cubic-bezier(.22,.61,.36,1),\n    opacity 0.7s ease,\n    filter 0.7s ease,\n    box-shadow 0.5s ease;\n  background: var(--uvg-green-deep);\n  color: #fff;\n  isolation: isolate;\n  will-change: transform, opacity;\n}\n.hero-card .card-bg {\n  position: absolute;\n  inset: 0;\n  z-index: 0;\n}\n.hero-card .card-bg image-slot {\n  width: 100%; height: 100%;\n  --slot-bg: linear-gradient(160deg, #1F7A52 0%, #08402A 100%);\n  --slot-border: transparent;\n  --slot-placeholder-color: rgba(255,255,255,0.55);\n}\n.hero-card .card-bg::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(\n    180deg,\n    rgba(8,20,15,0.65) 0%,\n    rgba(8,20,15,0.35) 30%,\n    rgba(8,20,15,0.30) 55%,\n    rgba(8,20,15,0.85) 100%);\n  z-index: 1;\n}\n.hero-card .card-body {\n  position: relative;\n  z-index: 2;\n  height: 100%;\n  display: flex;\n  flex-direction: column;\n  padding: 36px 32px 32px;\n  pointer-events: none;\n}\n.hero-card .card-kicker {\n  font-family: var(--font-sans);\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: #fff;\n  margin-bottom: 18px;\n}\n.hero-card .card-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 38px;\n  line-height: 1.05;\n  letter-spacing: -0.01em;\n  color: #fff;\n  margin: 0;\n  max-width: 14ch;\n  text-wrap: balance;\n}\n.hero-card .card-foot {\n  margin-top: auto;\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n  gap: 14px;\n  pointer-events: auto;\n}\n.hero-card .card-cta {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  background: var(--uvg-gold);\n  color: var(--uvg-green-deep);\n  font-weight: 700;\n  font-size: 14px;\n  letter-spacing: 0.04em;\n  padding: 16px 24px;\n  border-radius: 4px;\n  opacity: 0;\n  transform: translateY(8px);\n  transition: opacity .4s ease .2s, transform .4s ease .2s, background .2s ease;\n  white-space: nowrap;\n  border: none;\n  cursor: pointer;\n  font-family: var(--font-sans);\n  width: 100%;\n}\n.hero-card .card-cta:hover { background: #9DD24F; }\n.hero-card .card-cta svg { width: 14px; height: 14px; }\n\n.hero-card .card-meta {\n  font-size: 11.5px;\n  letter-spacing: 0.14em;\n  color: rgba(255,255,255,0.78);\n  text-transform: uppercase;\n  font-weight: 600;\n  opacity: 0;\n  transition: opacity .4s ease .2s;\n  text-align: center;\n}\n\n/* slot positions on the carousel */\n.hero-card[data-pos=\"0\"]     { /* center */\n  transform: translateX(0) translateZ(60px) scale(1);\n  z-index: 5;\n  filter: brightness(1);\n  box-shadow: 0 40px 80px -28px rgba(8,40,28,0.55);\n}\n.hero-card[data-pos=\"0\"] .card-cta,\n.hero-card[data-pos=\"0\"] .card-meta { opacity: 1; transform: translateY(0); }\n\n.hero-card[data-pos=\"-1\"] {\n  transform: translateX(-340px) translateZ(0) rotateY(8deg) scale(0.92);\n  z-index: 4;\n  filter: brightness(0.78);\n}\n.hero-card[data-pos=\"1\"] {\n  transform: translateX(340px) translateZ(0) rotateY(-8deg) scale(0.92);\n  z-index: 4;\n  filter: brightness(0.78);\n}\n.hero-card[data-pos=\"-2\"] {\n  transform: translateX(-620px) translateZ(-80px) rotateY(14deg) scale(0.82);\n  z-index: 3;\n  filter: brightness(0.6);\n}\n.hero-card[data-pos=\"2\"] {\n  transform: translateX(620px) translateZ(-80px) rotateY(-14deg) scale(0.82);\n  z-index: 3;\n  filter: brightness(0.6);\n}\n.hero-card[data-pos=\"-3\"], .hero margin-top: 18px;\n  padding-top: 14px;\n  border-top: 1px solid var(--line);\n  font-size: 13px;\n  color: var(--ink-soft);\n}\n.testim-card .career strong {\n  font-weight: 600;\n  color: var(--ink);\n}\n\n/* ============================================================\n   PROCESO / CÓMO POSTULARSE\n   ============================================================ */\n.proceso {\n  background: var(--uvg-green);\n  color: #fff;\n  padding: 120px 0;\n}\n.proceso .section-title { color: #fff; }\n.proceso .section-kicker { color: rgba(255,255,255,0.82); }\n\n.steps {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 14px;\n  margin-top: 56px;\n  counter-reset: step;\n}\n@media (min-width: 900px) { .steps { grid-template-columns: repeat(2, 1fr); } }\n\n.step {\n  background: rgba(255,255,255,0.05);\n  border: 1px solid rgba(255,255,255,0.14);\n  padding: 28px 28px 26px;\n  border-radius: 4px;\n  counter-increment: step;\n  position: relative;\n  transition: background .2s ease;\n}\n.step:hover { background: rgba(255,255,255,0.09); }\n.step::before {\n  content: counter(step, decimal-leading-zero);\n  font-family: var(--font-display);\n  font-size: 14px;\n  letter-spacing: 0.08em;\n  color: var(--uvg-gold);\n  display: block;\n  margin-bottom: 14px;\n}\n.step h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 24px;\n  line-height: 1.1;\n  margin-bottom: 12px;\n  color: #fff;\n}\n.step p, .step ul {\n  margin: 0;\n  font-size: 14.5px;\n  line-height: 1.55;\n  color: rgba(255,255,255,0.82);\n}\n.step ul {\n  list-style: none;\n  padding: 0;\n}\n.step ul li {\n  padding: 6px 0 6px 18px;\n  position: relative;\n}\n.step ul li::before {\n  content: \"\";\n  position: absolute;\n  left: 0; top: 14px;\n  width: 8px; height: 1px;\n  background: var(--uvg-gold);\n}\n\n.req-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 14px;\n  margin-top: 32px;\n}\n@media (min-width: 760px) { .req-grid { grid-template-columns: repeat(4, 1fr); } }\n.req-card {\n  background: rgba(255,255,255,0.06);\n  border: 1px solid rgba(255,255,255,0.14);\n  padding: 22px 22px;\n  border-radius: 4px;\n}\n.req-card .icon {\n  width: 32px; height: 32px;\n  border-radius: 50%;\n  background: var(--uvg-gold);\n  color: var(--uvg-green-deep);\n  display: inline-flex;\n  align-items: center; justify-content: center;\n  font-family: var(--font-display);\n  font-size: 18px;\n  margin-bottom: 14px;\n}\n.req-card h5 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: 19px;\n  margin-bottom: 6px;\n  color: #fff;\n}\n.req-card p {\n  margin: 0;\n  font-size: 13.5px;\n  line-height: 1.5;\n  color: rgba(255,255,255,0.78);\n}\n\n/* ============================================================\n   CTA / CONTACTO\n   ============================================================ */\n.cta {\n  padding: 120px 0;\n  background: var(--paper);\n  position: relative;\n}\n.cta-card {\n  background: var(--ink);\n  color: #fff;\n  border-radius: 6px;\n  padding: 80px 64px;\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 48px;\n  position: relative;\n  overflow: hidden;\n}\n@media (min-width: 900px) {\n  .cta-card { grid-template-columns: 1.3fr 1fr; align-items: end; gap: 64px; }\n}\n.cta-card::before {\n  content: \"\";\n  position: absolute;\n  inset: -40%;\n  background:\n    radial-gradient(ellipse at 80% 20%, rgba(31,122,82,0.55) 0%, transparent 50%),\n    radial-gradient(ellipse at 20% 90%, rgba(201,154,62,0.25) 0%, transparent 50%);\n  pointer-events: none;\n}\n.cta-card > * { position: relative; z-index: 1; }\n.cta-card h2 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(40px, 5vw, 64px);\n  line-height: 1;\n  letter-spacing: -0.02em;\n  margin-bottom: 24px;\n  text-wrap: balance;\n}\n.cta-card h2 em { font-style: italic; color: var(--uvg-gold); }\n.cta-card p {\n  font-size: 17px;\n  line-height: 1.5;\n  color: rgba(255,255,255,0.78);\n  max-width: 48ch;\n}\n.cta-side {\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n}\n.cta-side .email {\n  font-family: var(--font-display);\n  font-size: 28px;\n  color: #fff;\n  letter-spacing: -0.005em;\n  border-bottom: 1px solid rgba(255,255,255,0.2);\n  padding-bottom: 14px;\n}\n.cta-side .email small {\n  display: block;\n  font-family: var(--font-sans);\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: rgba(255,255,255,0.5);\n  margin-bottom: 8px;\n}\n.cta-side .row {\n  display: flex;\n  justify-content: space-between;\n  font-size: 13.5px;\n  color: rgba(255,255,255,0.7);\n  padding: 4px 0;\n}\n.cta-side .row strong {\n  color: #fff;\n  font-weight: 600;\n}\n\n/* ============================================================\n   FOOTER\n   ============================================================ */\n.foot {\n  background: var(--uvg-green-deep);\n  color: rgba(255,255,255,0.8);\n  padding: 72px 0 32px;\n  font-size: 13.5px;\n}\n.foot-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 48px;\n  padding-bottom: 48px;\n  border-bottom: 1px solid rgba(255,255,255,0.14);\n}\n@media (min-width: 800px) {\n  .foot-grid { grid-template-columns: 1.6fr repeat(3, 1fr); gap: 56px; }\n}\n.foot .brand img { height: 44px; width: auto; margin-bottom: 18px; filter: brightness(0) invert(1); }\n.foot .brand p { max-width: 36ch; color: rgba(255,255,255,0.7); line-height: 1.55; }\n\n.foot-social {\n  display: flex;\n  gap: 10px;\n  margin-top: 22px;\n}\n.foot-social a {\n  width: 40px;\n  height: 40px;\n  border-radius: 50%;\n  border: 1px solid rgba(255,255,255,0.22);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  color: rgba(255,255,255,0.85);\n  transition: background .2s ease, border-color .2s ease, color .2s ease, transform .2s ease;\n}\n.foot-social a:hover {\n  background: var(--uvg-gold);\n  border-color: var(--uvg-gold);\n  color: var(--uvg-green-deep);\n  transform: translateY(-2px);\n}\n.foot-social a svg { width: 18px; height: 18px; }\n\n.foot h5 {\n  color: var(--uvg-gold);\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  font-weight: 600;\n  margin-bottom: 16px;\n}\n.foot ul { list-style: none; padding: 0; margin: 0; }\n.foot ul li { padding: 5px 0; }\n.foot ul li a { color: rgba(255,255,255,0.8); transition: color .2s ease; }\n.foot ul li a:hover { color: #fff; }\n\n.foot-base {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding-top: 24px;\n  flex-wrap: wrap;\n  gap: 16px;\n  color: rgba(255,255,255,0.5);\n  font-size: 12px;\n  letter-spacing: 0.04em;\n}\n\n/* ============================================================\n   Image slot tweaks (inherits from base styles)\n   ============================================================ */\nimage-slot {\n  --slot-bg: rgba(14,92,61,0.08);\n  --slot-border: rgba(14,92,61,0.18);\n  --slot-fg: var(--uvg-green);\n  --slot-placeholder-color: var(--uvg-green);\n}\n.hero-bg image-slot,\n.testim-card .photo image-slot,\n.dest-card .photo image-slot {\n  --slot-bg: rgba(255,255,255,0.04);\n}\n.hero-bg image-slot {\n  --slot-bg: linear-gradient(135deg, #1F7A52 0%, #08402A 100%);\n  --slot-border: transparent;\n  --slot-placeholder-color: rgba(255,255,255,0.5);\n}\n\n/* ============================================================\n   UVG SKIN — appearance pass to mirror uvg.edu.gt\n   Bold uppercase sans headings, green keyword emphasis,\n   pill buttons. No structural/order changes.\n   ============================================================ */\n\n/* Montserrat needs heavier weight than the serif it replaces */\n.section-title,\n.hero-title,\n.cta-card h2 {\n  font-weight: 800;\n  text-transform: uppercase;\n  letter-spacing: -0.01em;\n  line-height: 1.02;\n}\n\n/* Keyword emphasis: green (like uvg.edu.gt headers), upright not italic */\n.section-title em,\n.hero-title em,\n.cta-card h2 em,\n.intro-body p em {\n  font-style: normal !important;\n  color: var(--uvg-green) !important;\n}\n/* On dark/green backgrounds keep the emphasis legible */\n.map-section .section-title em,\n.proceso .section-title em,\n.cta-card h2 em,\n.section--green .section-title em {\n  color: var(--uvg-gold) !important;\n}\n\n/* Hero */\n.hero-title { font-size: clamp(52px, 8vw, 112px); }\n.hero-tagline {\n  font-family: var(--font-display);\n  font-style: normal;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.02em;\n  font-size: clamp(15px, 1.8vw, 22px);\n  color: var(--uvg-green-soft);\n}\n\n/* Card / component headings: bold sans, title case (not uppercase) */\n.modal-card h3,\n.map-panel h3,\n.dest-card h3,\n.up-row .info h4,\n.testim-card .name,\n.step h4,\n.req-card h5,\n.pas-card h3,\n.pas-photo .badge .txt,\n.intro-body p,\n.cta-side .email {\n  font-weight: 700;\n  letter-spacing: -0.005em;\n}\n.intro-body p { font-weight: 600; line-height: 1.2; }\n.intro-body p:last-child { font-weight: 400; }\n\n/* Big numbers — heavy green like UVG stat/step blocks */\n.stat .num,\n.modal-card .num,\n.hero-card .card-title { font-weight: 800; }\n.hero-card .card-title { letter-spacing: -0.01em; }\n.modal-card .num { opacity: 0.18; }\n\n/* Eyebrows a touch bolder/greener */\n.eyebrow { font-weight: 700; }\n\n/* Buttons & CTAs — uppercase pill, UVG style */\n.btn,\n.nav-cta,\n.hero-card .card-cta {\n  text-transform: uppercase;\n  font-weight: 700;\n  letter-spacing: 0.06em;\n}\n.btn { border-radius: 999px; }\n\n/* Nav links a little stronger */\n.nav-menu a { font-weight: 600; }\n\n/* Section titles size tightening for uppercase sans */\n.section-title { font-size: clamp(32px, 4.4vw, 56px); }\n.cta-card h2 { font-size: clamp(34px, 4.4vw, 56px); }\n\n/* Filter / tab buttons uppercase */\n.filter-bar button,\n.map-filter button { text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }\n\n/* ============================================================\n   CÓMO APLICAR — light variant (cream bg, dark text)\n   ============================================================ */\n.proceso--light {\n  background: var(--paper-2);\n  color: var(--ink);\n}\n.proceso--light .section-title { color: var(--ink); }\n.proceso--light .section-kicker { color: var(--ink-soft); }\n.proceso--light .eyebrow { color: var(--uvg-green); }\n.proceso--light .eyebrow .dot { background: var(--uvg-green); }\n.proceso--light .section-title em { color: var(--uvg-green) !important; }\n\n.proceso--light .req-card {\n  background: var(--white);\n  border: 1px solid var(--line);\n}\n.proceso--light .req-card .icon {\n  background: var(--uvg-green);\n  color: #fff;\n}\n.proceso--light .req-card h5 { color: var(--ink); }\n.proceso--light .req-card p { color: var(--ink-soft); }\n\n.proceso--light .step {\n  background: var(--white);\n  border: 1px solid var(--line);\n}\n.proceso--light .step:hover { background: var(--white); border-color: var(--uvg-green); box-shadow: 0 24px 48px -30px rgba(8,40,28,0.22); }\n.proceso--light .step::before { color: var(--uvg-green); }\n.proceso--light .step h4 { color: var(--ink); }\n.proceso--light .step p, .proceso--light .step ul { color: var(--ink-soft); }\n.proceso--light .step ul li::before { background: var(--uvg-green); }\n\n/* ============================================================\n   DESTINOS REDIRECT BAND (en Intercambio)\n   ============================================================ */\n.dest-redirect {\n  background: var(--uvg-green);\n  color: #fff;\n  padding: 96px 0;\n}\n.dest-redirect .section-title { color: #fff; }\n.dest-redirect .eyebrow { color: var(--uvg-gold); }\n.dest-redirect .eyebrow .dot { background: var(--uvg-gold); }\n.dest-redirect .section-kicker { color: rgba(255,255,255,0.82); }\n.dest-redirect .section-title em { color: var(--uvg-gold) !important; }\n\n.region-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 16px;\n  margin-top: 48px;\n}\n@media (min-width: 560px) { .region-grid { grid-template-columns: repeat(2, 1fr); } }\n@media (min-width: 920px) { .region-grid { grid-template-columns: repeat(4, 1fr); } }\n\n.region-card {\n  display: flex;\n  flex-direction: column;\n  justify-content: space-between;\n  gap: 28px;\n  min-height: 190px;\n  padding: 26px 24px;\n  border-radius: 6px;\n  background: rgba(255,255,255,0.06);\n  border: 1px solid rgba(255,255,255,0.16);\n  color: #fff;\n  transition: background .25s ease, transform .25s ease, border-color .25s ease;\n}\n.region-card:hover {\n  background: rgba(255,255,255,0.12);\n  border-color: rgba(255,255,255,0.3);\n  transform: translateY(-4px);\n}\n.region-card .rc-count {\n  font-family: var(--font-display);\n  font-weight: 800;\n  font-size: 40px;\n  line-height: 1;\n  color: var(--uvg-gold);\n}\n.region-card .rc-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: 22px;\n  line-height: 1.1;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n}\n.region-card .rc-name svg { width: 20px; height: 20px; flex: none; transition: transform .25s ease; }\n.region-card:hover .rc-name svg { transform: translate(3px, -3px); }\n\n.dest-redirect .redirect-cta {\n  display: flex;\n  justify-content: center;\n  margin-top: 44px;\n}\n\n/* ============================================================\n   TESTIMONIOS — category headings\n   ============================================================ */\n.testim-cat {\n  margin: 88px 0 8px;\n  display: flex;\n  align-items: baseline;\n  gap: 16px;\n  border-top: 1px solid var(--line);\n  padding-top: 32px;\n}\n.testim-cat:first-of-type { margin-top: 56px; }\n.testim-cat h3 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(26px, 3vw, 38px);\n  line-height: 1;\n  letter-spacing: -0.01em;\n  color: var(--ink);\n}\n.testim-cat .cat-count {\n  font-size: 13px;\n  font-weight: 600;\n  letter-spacing: 0.04em;\n  color: var(--uvg-green);\n  text-transform: uppercase;\n}\n\n/* ============================================================\n   ESPECIALIZACIÓN\n   ============================================================ */\n.espec-hero {\n  padding: 120px 0 0;\n}\n.espec-grid {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 24px;\n  margin-top: 56px;\n}\n@media (min-width: 820px) { .espec-grid { grid-template-columns: repeat(3, 1fr); } }\n\n.espec-card {\n  background: var(--white);\n  border: 1px solid var(--line);\n  border-radius: 6px;\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  transition: transform .25s ease, box-shadow .25s ease;\n}\n.espec-card:hover { transform: translateY(-4px); box-shadow: 0 24px 48px -30px rgba(8,40,28,0.25); }\n.espec-card .photo { position: relative; aspect-ratio: 16/10; background: var(--uvg-green-pale); }\n.espec-card .photo image-slot { width: 100%; height: 100%; }\n.espec-card .photo .lvl {\n  position: absolute; top: 14px; left: 14px; z-index: 2;\n  background: var(--uvg-green); color: #fff;\n  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;\n  padding: 6px 12px; border-radius: 999px;\n}\n.espec-card .body { padding: 26px 26px 28px; display: flex; flex-direction: column; gap: 12px; flex: 1; }\n.espec-card h3 {\n  font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.1;\n  color: var(--ink); letter-spacing: -0.005em;\n}\n.espec-card p { margin: 0; font-size: 14.5px; line-height: 1.55; color: var(--ink-soft); }\n.espec-card .espec-tags { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }\n.espec-card .espec-tags .tag {\n  font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600;\n  color: var(--uvg-green); background: var(--uvg-green-pale); padding: 5px 10px; border-radius: 999px;\n}\n.espec-facts {\n  display: grid;\n  gap: 0;\n  margin: 2px 0 4px;\n}\n.espec-facts .ef {\n  display: grid;\n  grid-template-columns: 96px 1fr;\n  gap: 12px;\n  padding: 8px 0;\n  border-top: 1px solid var(--line);\n  font-size: 13.5px;\n  line-height: 1.4;\n}\n.espec-facts .ef dt {\n  color: var(--muted);\n  text-transform: uppercase;\n  letter-spacing: 0.06em;\n  font-size: 10.5px;\n  font-weight: 700;\n}\n.espec-facts .ef dd { margin: 0; color: var(--ink-soft); }\n.espec-facts .ef dd strong { color: var(--ink); font-weight: 700; }\n\n/* only two specializations → two columns, centered */\n.espec-grid--two {\n  grid-template-columns: 1fr;\n  max-width: 860px;\n}\n@media (min-width: 820px) { .espec-grid--two { grid-template-columns: repeat(2, 1fr); } }\n\n/* clickable modality cards (link to destinos) */\na.modal-card { text-decoration: none; cursor: pointer; }\na.modal-card .go {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  margin-top: 4px;\n  font-size: 12px;\n  font-weight: 700;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  color: var(--uvg-green);\n}\na.modal-card .go svg { width: 14px; height: 14px; transition: transform .2s ease; }\na.modal-card:hover .go svg { transform: translate(3px, -3px); }\n<\u002Fstyle>\n\n  <script src=\"0b581183-2941-4443-81a0-d7d3599b1154\" defer=\"\"><\u002Fscript>\n<\u002Fhead>\n<body data-page=\"especializacion\">\n\n  <header class=\"site-header\" style=\"background-color: rgb(59, 58, 60)\">\n    <div class=\"wrap nav\">\n      <a class=\"nav-logo\" href=\"index.html\" aria-label=\"UVG Global · Inicio\">\n        <img src=\"6d5fcccb-55a8-41f3-9cc6-c01279495c74\" alt=\"UVG Global\" style=\"height: 30px; width: 220px\">\n      <\u002Fa>\n\n      <nav class=\"nav-menu\" aria-label=\"Principal\">\n        <a href=\"index.html\" style=\"color: rgb(255, 255, 255)\">Inicio<\u002Fa>\n        <a href=\"intercambio.html\" style=\"color: rgb(255, 255, 255)\">Intercambio<\u002Fa>\n        <a href=\"pasantias.html\" style=\"color: rgb(255, 255, 255)\">Pasantías<\u002Fa>\n        <a href=\"viajes.html\" style=\"color: rgb(255, 255, 255)\">Viajes Académicos<\u002Fa>\n        <a href=\"especializacion.html\" style=\"color: rgb(139, 197, 63)\" aria-current=\"page\">Especialización<\u002Fa>\n        <a href=\"estudiantes.html\" style=\"color: rgb(255, 255, 255)\">Testimonios<\u002Fa>\n        <a href=\"destinos.html\" style=\"color: rgb(255, 255, 255)\">Destinos<\u002Fa>\n      <\u002Fnav>\n\n      <a class=\"nav-cta\" href=\"https://outlook.office.com/book/StudyAbroadAdvisingSession@uvg.edu.gt/?ismsaljsauthenabled\" target=\"_blank\" rel=\"noopener\" style=\"background-color: rgb(105, 188, 74)\">\n        Aplicar\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M7 17L17 7M9 7h8v8\"><\u002Fpath><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main id=\"top\">\n\n    <section id=\"especializacion\" class=\"pasantias espec-hero\" data-screen-label=\"Especialización\">\n      <div class=\"wrap\">\n        <div class=\"section-head section-head--split\">\n          <div>\n            <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>Especialización<\u002Fdiv>\n            <h2 class=\"section-title\">Especialízate en <em style=\"font-style:italic;color:var(--uvg-green-soft);\">ingeniería de vuelo.<\u002Fem><\u002Fh2>\n          <\u002Fdiv>\n          <p class=\"section-kicker\">La Facultad de Ingeniería ofrece dos especialidades que implican un semestre adicional de estudios en una universidad del exterior. El diploma de la especialidad lo otorga la UVG al convalidar los cursos aprobados.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"espec-grid espec-grid--two\">\n          <article class=\"espec-card\">\n            <div class=\"photo\">\n              <span class=\"lvl\">Aeroespacial · Alemania<\u002Fspan>\n              <image-slot id=\"espec-aeroespacial\" shape=\"rect\" placeholder=\"Foto de Würzburg, JMU o tema aeroespacial\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div class=\"body\">\n              <h3>Ingeniería Aeroespacial<\u002Fh3>\n              <p>Un semestre en la Julius Maximilians Universität Würzburg (JMU), una de las universidades más antiguas de Alemania (1402) y con 14 premios Nobel. Cursos de nivel maestría en Aerospace Informatics, impartidos en inglés.<\u002Fp>\n              <dl class=\"espec-facts\">\n                <div class=\"ef\"><dt>Universidad<\u002Fdt><dd><strong>JMU Würzburg<\u002Fstrong><\u002Fdd><\u002Fdiv>\n                <div class=\"ef\"><dt>Semestre<\u002Fdt><dd>Marzo a agosto<\u002Fdd><\u002Fdiv>\n                <div class=\"ef\"><dt>Cursos<\u002Fdt><dd>5 cursos (≥3 de aeroespacial), nivel maestría<\u002Fdd><\u002Fdiv>\n                <div class=\"ef\"><dt>Costo<\u002Fdt><dd>168.50 € en JMU + 50% por curso convalidado en UVG · vida ≈ 900 €/mes<\u002Fdd><\u002Fdiv>\n              <\u002Fdl>\n              <div class=\"espec-tags\"><span class=\"tag\">Inglés B2<\u002Fspan><span class=\"tag\">Nivel maestría<\u002Fspan><span class=\"tag\">Convenio<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n          <article class=\"espec-card\">\n            <div class=\"photo\">\n              <span class=\"lvl\">Aeronáutica · España<\u002Fspan>\n              <image-slot id=\"espec-aeronautica\" shape=\"rect\" placeholder=\"Foto de Madrid, UEM o tema aeronáutico\"><\u002Fimage-slot>\n            <\u002Fdiv>\n            <div class=\"body\">\n              <h3>Ingeniería Aeronáutica<\u002Fh3>\n              <p>Un semestre en la Universidad Europea de Madrid (UEM), de enfoque científico-tecnológico, con makerspace y laboratorios propios y un máximo de 25 estudiantes por clase. Cursos de aeronáutica impartidos en inglés.<\u002Fp>\n              <dl class=\"espec-facts\">\n                <div class=\"ef\"><dt>Universidad<\u002Fdt><dd><strong>U. Europea de Madrid<\u002Fstrong><\u002Fdd><\u002Fdiv>\n                <div class=\"ef\"><dt>Semestre<\u002Fdt><dd>3ª semana de enero a mediados de junio<\u002Fdd><\u002Fdiv>\n                <div class=\"ef\"><dt>Cursos<\u002Fdt><dd>5 cursos · 30 ECTS (≥3 de aeronáutica)<\u002Fdd><\u002Fdiv>\n                <div class=\"ef\"><dt>Costo<\u002Fdt><dd>133 €/ECTS (≈3,990 € por 30 ECTS) + 50% por curso convalidado en UVG · vida ≈ 900 €/mes<\u002Fdd><\u002Fdiv>\n              <\u002Fdl>\n              <div class=\"espec-tags\"><span class=\"tag\">Inglés B2<\u002Fspan><span class=\"tag\">30 ECTS<\u002Fspan><span class=\"tag\">Convenio<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"aplicar\" class=\"proceso proceso--light\" data-screen-label=\"Cómo aplicar Especialización\">\n      <div class=\"wrap\">\n        <div class=\"section-head section-head--split\">\n          <div>\n            <div class=\"eyebrow\"><span class=\"dot\"><\u002Fspan>Cómo aplicar · Especialización<\u002Fdiv>\n            <h2 class=\"section-title\">Convocatoria anual en <em>julio.<\u002Fem><\u002Fh2>\n          <\u002Fdiv>\n          <p class=\"section-kicker\">La decanatura de la Facultad de Ingeniería abre la convocatoria cada año en julio y envía el formulario a través de los departamentos. Un comité selecciona a los participantes y los notifica en agosto.<\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"req-grid\">\n          <div class=\"req-card\">\n            <div class=\"icon\">7º<\u002Fdiv>\n            <h5>Penúltimo año<\u002Fh5>\n            <p>Estar al menos en el penúltimo año de tu carrera al presentar la aplicación.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"req-card\">\n            <div class=\"icon\">85<\u002Fdiv>\n            <h5>Promedio ≥ 85<\u002Fh5>\n            <p>Promedio acumulado mínimo de 85 puntos, sin llamadas de atención en tu expediente.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"req-card\">\n            <div class=\"icon\">B2<\u002Fdiv>\n            <h5>Inglés B2<\u002Fh5>\n            <p>Constancia de dominio del idioma inglés con nivel B2 como mínimo.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"req-card\">\n            <div class=\"icon\">✎<\u002Fdiv>\n            <h5>Carta y CV<\u002Fh5>\n            <p>Carta de motivación, CV y compromiso de completar el programa y cubrir los costos.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"steps\">\n          <article class=\"step\">\n            <h4>Convocatoria y aplicación<\u002Fh4>\n            <ul>\n              <li>En julio la decanatura envía el formulario electrónico<\u002Fli>\n              <li>Adjuntar carta de motivación, CV y constancia de inglés B2<\u002Fli>\n              <li>Confirmar el compromiso de cubrir los costos del programa<\u002Fli>\n            <\u002Ful>\n          <\u002Farticle>\n          <article class=\"step\">\n            <h4>Selección por comité<\u002Fh4>\n            <ul>\n              <li>Se evalúan requisitos, logros y actividades extracurriculares<\u002Fli>\n              <li>Participación en el laboratorio aeroespacial (para aeroespacial)<\u002Fli>\n              <li>Los seleccionados se notifican en agosto<\u002Fli>\n            <\u002Ful>\n          <\u002Farticle>\n          <article class=\"step\">\n            <h4>Nominación y semestre en el exterior<\u002Fh4>\n            <ul>\n              <li>UVG nomina al estudiante ante JMU (aeroespacial) o UEM (aeronáutica)<\u002Fli>\n              <li>Cursar 5 cursos (al menos 3 de la especialidad), en inglés<\u002Fli>\n              <li>Tramitar visa, seguro médico y alojamiento<\u002Fli>\n            <\u002Ful>\n          <\u002Farticle>\n          <article class=\"step\">\n            <h4>Convalidación en UVG<\u002Fh4>\n            <ul>\n              <li>Convalidar al menos 3 cursos por Tópicos 1, 2 y 3<\u002Fli>\n              <li>Aprobados con el equivalente a 70 puntos de nota<\u002Fli>\n              <li>Se paga el 50% del costo de cada curso convalidado<\u002Fli>\n            <\u002Ful>\n          <\u002Farticle>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n\n  <footer class=\"foot\">\n    <div class=\"wrap\">\n      <div class=\"foot-grid\">\n        <div class=\"brand\">\n          <img src=\"6d5fcccb-55a8-41f3-9cc6-c01279495c74\" alt=\"UVG Global\" style=\"width: 250px; height: 40px\">\n          <p>Relaciones Internacionales · Universidad del Valle de Guatemala. Más de 60 años llevando la educación guatemalteca al mundo.<\u002Fp>\n          <div class=\"foot-social\">\n            <a href=\"https://www.facebook.com/CDIUVG/about\" target=\"_blank\" rel=\"noopener\" aria-label=\"Facebook\">\n              <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M14 9h3l.5-3H14V4.5c0-.8.3-1.5 1.6-1.5H17.6V.2C17.2.1 16 0 14.8 0 12.2 0 10.5 1.6 10.5 4.3V6H8v3h2.5v9H14V9z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n            <a href=\"https://youtube.com/@cdiuvg3724?si=jEaHlYdPpgnHzHYM\" target=\"_blank\" rel=\"noopener\" aria-label=\"YouTube\">\n              <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M23 12s0-3.2-.4-4.7c-.2-.85-.9-1.5-1.7-1.7C19.4 5.2 12 5.2 12 5.2s-7.4 0-8.9.4c-.8.2-1.5.85-1.7 1.7C1 8.8 1 12 1 12s0 3.2.4 4.7c.2.85.9 1.5 1.7 1.7 1.5.4 8.9.4 8.9.4s7.4 0 8.9-.4c.8-.2 1.5-.85 1.7-1.7.4-1.5.4-4.7.4-4.7zM9.8 15.3V8.7l6 3.3-6 3.3z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n            <a href=\"https://www.linkedin.com/in/uvg-global-bbb0a139b/\" target=\"_blank\" rel=\"noopener\" aria-label=\"LinkedIn\">\n              <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM10 9h3.8v1.7h.05c.53-1 1.83-2.05 3.76-2.05 4.02 0 4.76 2.65 4.76 6.1V21h-4v-5.4c0-1.29-.02-2.95-1.8-2.95-1.8 0-2.07 1.4-2.07 2.85V21H10z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h5>El programa<\u002Fh5>\n          <ul>\n            <li><a href=\"index.html\">Sobre nosot
